<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border: 1px solid #000;
            border-collapse: collapse;
        }
        th{
             border: 1px solid #000;
             width : 60px;
             height: 40px;
        }
        td{
             border: 1px solid #000;
             height: 40px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>점수</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>김준일</td>
                 <td>60</td>
            </tr>
            <tr>
                <td>2</td>
                <td>김준이</td>
                 <td>70</td>
            </tr>
            <tr>
                <td>3</td>
                <td>김준삼</td>
                 <td>80</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">합계</th>
                <td>210</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>

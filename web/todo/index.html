<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e9edf5;


        }


        body>div:nth-of-type(1) {
            background-color: #ffffff;
            width: 400px;
            height: 600px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-shadow:
                10px -10px 0 #c5cce6;


        }

        body>div:nth-of-type(1)>div:nth-of-type(1) {
            width: 100%;
            height: 50px;

            box-sizing: border-box;
            display: flex;
            color: #1f2937;

            &>input {

                flex-grow: 1;
                border-radius: 8px;
            }

            &>button {

                padding: 5px 15px;
                border-radius: 8px;
            }
        }

        body>div:nth-of-type(1)>button {
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            margin-top: 10px;
            border-radius: 8px;
        }

        body>div:nth-of-type(1)>div:nth-of-type(2) {
            flex-grow: 1;

            box-sizing: border-box;
            margin-top: 10px;
            padding: 5px;
            border-radius: 8px;

            &>div {
                box-sizing: border-box;
                width: 100%;
                height: 50px;
                border: 2px solid black;
                display: flex;
                padding: 5px;
                margin-bottom: 5px;
                border-radius: 8px;


                &>input[type="text"] {
                    flex-grow: 1;
                    box-sizing: border-box;
                    height: 100%;
                    outline: none;
                    border: none
                }

                &>button {
                    margin-left: 5px;
                    padding: 5px 15px;
                    border-radius: 8px;

                }
            }
        }
    </style>
</head>

<body>

    <div>
        <div>
            <input type="text">
            <button>초기화</button>
        </div>
        <button>버튼</button>
        <div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>
            <div>
                <input type="checkbox">
                <input type="text" class="write">
                <button class="del">삭제</button>
            </div>


        </div>
    </div>

    <script>

        const deleteButtons = document.querySelectorAll(".del");
        for (let i = 0; i < deleteButtons.length; i++) {
            deleteButtons[i].onclick = () => {
                const textClears = document.querySelectorAll(".write");
                textClears[i].value = "";

            }
        }

    </script>

</body>

</html>

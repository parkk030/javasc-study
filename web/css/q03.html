<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
 p { color: gray; }
 .txt { color: blue; }
 #main { color: green; }
 .box p { color: orange; }
 .highlight { color: red !important; }
</style>

</head>
<body>
<div class="box">
 <p>1</p>
 <p class="txt">2</p>
 <p class="txt" id="main">3</p>
 <p class="txt" style="color: purple;">4</p>
 <p class="txt highlight" style="color: black;">5</p>
</div>
<p class="txt">6</p>
</body>
</html>

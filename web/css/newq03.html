<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .pw-box{
            width: 300px;
            height: 40px;
            position: relative;
        }

        .pw-input{
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding-left: 35px;
            padding-right: 55px;
        }
        .lock{
            top: 50%;
            transform: translateY(-50%);
            position: absolute;
            left: 10px;
        }

        .show{
            top: 50%;
            transform: translateY(-50%);
            position: absolute;
            right: 5px;
            cursor:pointer;
        }

    </style>
</head>

<body>
    <div class="pw-box">
        <span class="lock">🔒</span>
        <input type="password" class="pw-input" placeholder="비밀번호">
        <button class="show">보기</button>
    </div>
<script>
 const showButton = document.querySelector(".show");
 showButton.onclick = () =>{
    const pwInput = document.querySelector(".pw-input");
    if(pwInput.type ==='password'){
        pwInput.type = 'text';
        showButton.innerHTML = '숨기기'
    } else {
        pwInput.type = 'password';
        showButton.innerHTML = '보기'
    }
 }
</script>
   
</body>

</html>

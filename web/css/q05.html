<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card p{
            color: blue;
        }
        .card h2+p{
            font-weight: bold;
        }
        .body > p{
            background-color: lightyellow;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>공지사항</h2>
        <p>요약 문장입니다.</p>
        <div class="body">     
            <p>본문 문장입니다.</p>
            <div>
                <p>더 깊은 문장입니다.</p>
            </div>
        </div>
    </div>

</body>

</html>

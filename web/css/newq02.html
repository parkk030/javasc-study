<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .overlay{
            position: relative;
            width: 500px;
            height: 350px;
            background-color: rgba(0,0,0,0.5);
        }

        .modal{
            width: 250px;
            height: 150px;
            background-color: #fff;
            box-sizing: border-box;
            position: absolute;
            border-radius: 8px;
            padding: 20px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);   
        }

        .close{
            position:absolute;
            top: 8px;
            right: 8px;
        }

        
    </style>
</head>

<body>
    <div class="overlay">
        <div class="modal">
            <button class="close">X</button>
            <h3>알림</h3>
            <p>저장되었습니다.</p>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .position-box {
            position: relative;
            box-sizing: border-box;
            border: 1px solid #222;
            width: 400px;
            height: 400px;

        }

        .position-box>div {

            box-sizing: border-box;
            border: 1px solid #222;
            width: 100px;
            height: 100px;
        }

        .box1 {
            background-color: red;
            position: absolute;
            left: 200px;
        }

        .position-box2 {
            display: flex;

            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid #222;
            width: 700px;
            height: 1700px;
        }

        .box2 {
            position: absolute;
            background-color: blue;
            top: 100px;
            left: 200px;
        }

        .box4 {
            position: fixed;
            top: 50px;
            right: 300px;
            box-sizing: border-box;
            border: 1px solid #222;
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="position-box2">
        <div class="position-box">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3"></div>

        </div>
    </div>
    <div class="box4"></div>
</body>

</html>

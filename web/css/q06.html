<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        .active{
            color: red;
        }

        .active +li{
            text-decoration: underline
        }

        .active ~li{
            color: gray;
        }
    </style>
</head>

    <ul class="menu">
        <li>홈</li>
        <li class="active">소개</li>

        <li>문의</li>
    </ul>

</body>

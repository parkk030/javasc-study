<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .box1{
            border: 1px solid #222;
            padding: 10px;
            width: 78px;
            height: 78px;
            background-color: red;
        }

        .box2{
            box-sizing: border-box;
            border: 1px solid #222;
            padding: 10px;
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        .menu1{
            padding: 20px;
            cursor: pointer;
            border: 2px solid #222;
        }

        .menu2{
            margin: 20px;
            cursor: pointer;
            border: 2px solid #222;
        }

        .shbox{
            width: 100px;
            height: 100px;
            box-shadow: 0 0 10px 20px red;
        }

        .shbox2{
            width: 100px;
            height: 100px;
            box-shadow: 0 0 5px 5px ;
        }

    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div>
        <span class="menu1">회사소개</span>
        <span class="menu1">회사소개2</span>
    </div>
    <div>
        <span class="menu2">회사소개</span>
        <span class="menu2">회사소개2</span>
    </div>
    <div class="shbox">

    </div>
    <div class="shbox2">

    </div>
</body>
</html>
